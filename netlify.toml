[build]
  base = "."
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/movie-tracker run build"
  publish = "artifacts/movie-tracker/dist/public"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
