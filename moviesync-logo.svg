<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EAB308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon rounded background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Subtle inner vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" style="stop-color:#EAB30808"/>
    <stop offset="100%" style="stop-color:#00000066"/>
  </radialGradient>
  <rect width="512" height="512" rx="110" ry="110" fill="url(#vignette)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CINEMA TICKET — diagonal, centered             -->
  <!-- ═══════════════════════════════════════════════ -->
  <g transform="translate(256,256) rotate(-18)">

    <!-- Ticket body -->
    <rect x="-175" y="-68" width="350" height="136" rx="16" ry="16"
          fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Left notch (half circle cutout) -->
    <circle cx="-175" cy="0" r="22" fill="url(#bgGrad)"/>

    <!-- Right notch (half circle cutout) -->
    <circle cx="175" cy="0" r="22" fill="url(#bgGrad)"/>

    <!-- Perforated divider line (left zone) -->
    <line x1="-120" y1="-52" x2="-120" y2="52"
          stroke="#0a0a0a" stroke-width="3" stroke-dasharray="8,6" opacity="0.5"/>

    <!-- Perforated divider line (right zone) -->
    <line x1="120" y1="-52" x2="120" y2="52"
          stroke="#0a0a0a" stroke-width="3" stroke-dasharray="8,6" opacity="0.5"/>

    <!-- ═══════════════════════════════════════════ -->
    <!-- SYNC ARROWS — center of ticket             -->
    <!-- Two circular arrows forming sync symbol   -->
    <!-- ═══════════════════════════════════════════ -->

    <!-- Outer sync ring — top arc (clockwise arrow) -->
    <path d="M -58,0 A 58,58 0 1,1 58,0"
          fill="none"
          stroke="#0a0a0a"
          stroke-width="18"
          stroke-linecap="round"/>

    <!-- Top arc arrowhead -->
    <polygon points="58,-14 72,4 44,4"
             fill="#0a0a0a"/>

    <!-- Bottom arc (counter arc) -->
    <path d="M 58,0 A 58,58 0 1,1 -58,0"
          fill="none"
          stroke="#0a0a0a"
          stroke-width="18"
          stroke-linecap="round"/>

    <!-- Bottom arc arrowhead -->
    <polygon points="-58,14 -72,-4 -44,-4"
             fill="#0a0a0a"/>

    <!-- Center play dot -->
    <circle cx="0" cy="0" r="14" fill="#0a0a0a"/>
    <polygon points="-5,-9 12,0 -5,9" fill="url(#goldGrad)"/>

  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Subtle gold corner accents                     -->
  <!-- ═══════════════════════════════════════════════ -->
  <circle cx="256" cy="256" r="195" fill="none"
          stroke="#EAB308" stroke-width="1.5" opacity="0.12"/>

</svg>

